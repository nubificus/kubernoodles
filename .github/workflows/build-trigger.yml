name: 🍜 Build/publish base runners manual

on:
  push:
    paths:
      - 'images/*.Dockerfile'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  get-changed-files:
    runs-on: ubuntu-latest
    outputs:
      base_files: ${{ steps.filter.outputs.base_files }}
      torch_files: ${{ steps.filter.outputs.torch_files }}
      tf_files: ${{ steps.filter.outputs.tf_files }}
      tvm_files: ${{ steps.filter.outputs.tvm_files }}
      opencv_files: ${{ steps.filter.outputs.opencv_files }}
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Get Changed Files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: 'json'
          base: 'feat_fix_jetson'
          filters: |
            base:
              - 'images/rootless-ubuntu-*-base.Dockerfile'
            torch:
              - 'images/rootless-ubuntu-*-torch.Dockerfile'
            tf:
              - 'images/rootless-ubuntu-*-tf.Dockerfile'
            tvm:
              - 'images/rootless-ubuntu-*-tvm.Dockerfile'
            opencv:
              - 'images/rootless-ubuntu-*-opencv.Dockerfile'

  process-dockerfiles:
    needs: get-changed-files
    runs-on: ubuntu-latest
    outputs:
      processed_files: ${{ steps.process.outputs.processed_files }}
    steps:
      - name: Process Changed Files
        id: process
        env:
          ALL_OUTPUTS: ${{ toJson(needs.get-changed-files.outputs) }}
        run: |
          CATEGORIES=(base torch tf tvm opencv)
          FINAL_NAMES=()

          for CATEGORY in "${CATEGORIES[@]}"; do
            FILES=$(echo "$ALL_OUTPUTS" | jq -r ".\"${CATEGORY}_files\"")
            if [ "$FILES" = "null" ] || [ "$FILES" = "[]" ]; then
              continue
            fi

            FILES_ARRAY=($(echo "$FILES" | jq -r '.[]'))
            for FILE_PATH in "${FILES_ARRAY[@]}"; do
              NEW_NAME=$(basename "$FILE_PATH" .Dockerfile | sed 's/^images\///')
              FINAL_NAMES+=("\"$NEW_NAME\"")
            done
          done

          if [ ${#FINAL_NAMES[@]} -eq 0 ]; then
            echo "processed_files=[]" >> "$GITHUB_OUTPUT"
          else
            JSON_OUTPUT=$(printf "[%s]" "$(IFS=,; echo "${FINAL_NAMES[*]}")")
            echo "processed_files=$JSON_OUTPUT" >> "$GITHUB_OUTPUT"
          fi


  set-matrix:
    needs: process-dockerfiles
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Set matrix from processed files
        id: set
        run: |
          FILES='${{ needs.process-dockerfiles.outputs.processed_files }}'
          
          if [ "$FILES" = "[]" ]; then
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          FILE_ARRAY=$(echo "$FILES" | jq -r '.[]')
          
          MATRIX_ENTRIES=()
          for FILE in $FILE_ARRAY; do
            if [[ "$FILE" == *"-base" ]]; then
              ARCHS='["amd64", "arm64", "arm"]'
            else
              ARCHS='["amd64", "arm64"]'
            fi
          
            ENTRY=$(jq -n \
              --arg df "$FILE" \
              --argjson archs "$ARCHS" \
              '{dockerfile: $df, runner_archs: $archs}')
            MATRIX_ENTRIES+=("$ENTRY")
          done
          
          FINAL_MATRIX=$(jq -n --argjson entries "$(printf '%s\n' "${MATRIX_ENTRIES[@]}" | jq -s '.')" \
            '{include: $entries}')
          
          # Compact JSON to single line to satisfy GitHub Actions output format
          echo "matrix=$(echo "$FINAL_MATRIX" | jq -c '.')" >> $GITHUB_OUTPUT
      - name: Debug processed_files
        run: echo "${{ needs.process-dockerfiles.outputs.processed_files }}"
      - name: Debug matrix
        run: echo "${{ steps.set.outputs.matrix }}"

        


  build-dockerfiles:
    needs: set-matrix
    if: ${{ join(fromJson(needs.set-matrix.outputs.matrix).include, ',') != '' }}
    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build-latest.yml
    with:
      runner: '["base", "dind", "2204"]'
      dockerfiles: ${{ toJson(matrix.dockerfile) }}
      #runner-archs: ${{ toJson(matrix.runner_archs) }}
      runner-archs: '["amd64", "arm64", "arm"]'
    secrets: inherit
