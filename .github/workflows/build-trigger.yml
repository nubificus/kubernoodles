name: 🍜 Build/publish base runners

on:
  push:
    paths:
      - 'images/*.Dockerfile'
            #- 'images/rootless-ubuntu-jammy-base.Dockerfile'
            #- 'images/rootless-ubuntu-numbat-base.Dockerfile'

  workflow_dispatch: # build on demand
  #schedule:
  #  - cron: "43 6 * * 0" # build every Sunday at 6:43 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  get-changed-files:
    runs-on: ubuntu-latest
    outputs:
      files_base: ${{ steps.replace_files_base.outputs.base_files_new }}
      files_torch: ${{ steps.replace_files_torch.outputs.torch_files_new }}
      files_tf: ${{ steps.replace_files_tf.outputs.tf_files_new }}
      base: ${{ steps.filter.outputs.base }}
      torch: ${{ steps.filter.outputs.torch }}
      tf: ${{ steps.filter.outputs.tf }}
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Get Changed Files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: 'json'
          base: 'feat_fix'
          filters: |
            base:
              - 'images/rootless-ubuntu-*-base.Dockerfile'
            torch:
              - 'images/rootless-ubuntu-*-torch.Dockerfile'
            tf:
              - 'images/rootless-ubuntu-*-tf.Dockerfile'

      - name: Show Changed Files
        run: |
          echo "Files in base: ${{ steps.filter.outputs.base_files }}"
          echo "Files in torch: ${{ steps.filter.outputs.torch_files }}"
          echo "Files in tf: ${{ steps.filter.outputs.tf_files }}"
          echo "Files changed: ${{ steps.filter.outputs.changes }}"

      - name: Replace file paths in base_files
        id: replace_files_base
        run: |
          # Get the changed Dockerfiles from the paths-filter output
          FILES="${{ steps.filter.outputs.base_files }}"

          # Remove the brackets and split the string by commas
          FILES_ARRAY=($(echo "$FILES" | sed 's/[][]//g' | tr ',' '\n'))

          # Initialize a variable to store the new names
          NEW_FILE_NAMES=()

          # Loop through the files and replace the paths
          for FILE_PATH in "${FILES_ARRAY[@]}"; do
            echo "Processing file: $FILE_PATH"
            # Remove 'images/' and '.Dockerfile' from the filename
            NEW_NAME=$(basename "$FILE_PATH" .Dockerfile | sed 's/^images\///')
            # Append the new name to the array
            NEW_FILE_NAMES+=("\"$NEW_NAME\"")
          done

          # Join the array into a JSON array format
          JSON_OUTPUT=$(printf "[%s]" "$(IFS=,; echo "${NEW_FILE_NAMES[*]}")")

          # Debugging output
          echo "Final JSON Output: $JSON_OUTPUT"

          # Set the output for the replaced names in JSON format
          echo "::set-output name=base_files_new::$JSON_OUTPUT"

      - name: Replace file paths in torch_files
        id: replace_files_torch
        run: |
          # Get the changed Dockerfiles from the paths-filter output
          FILES="${{ steps.filter.outputs.torch_files }}"

          # Remove the brackets and split the string by commas
          FILES_ARRAY=($(echo "$FILES" | sed 's/[][]//g' | tr ',' '\n'))

          # Initialize a variable to store the new names
          NEW_FILE_NAMES=()

          # Loop through the files and replace the paths
          for FILE_PATH in "${FILES_ARRAY[@]}"; do
            echo "Processing file: $FILE_PATH"
            # Remove 'images/' and '.Dockerfile' from the filename
            NEW_NAME=$(basename "$FILE_PATH" .Dockerfile | sed 's/^images\///')
            # Append the new name to the array
            NEW_FILE_NAMES+=("\"$NEW_NAME\"")
          done

          # Join the array into a JSON array format
          JSON_OUTPUT=$(printf "[%s]" "$(IFS=,; echo "${NEW_FILE_NAMES[*]}")")

          # Debugging output
          echo "Final JSON Output: $JSON_OUTPUT"

          # Set the output for the replaced names in JSON format
          echo "::set-output name=torch_files_new::$JSON_OUTPUT"

      - name: Replace file paths in tf_files
        id: replace_files_tf
        run: |
          # Get the changed Dockerfiles from the paths-filter output
          FILES="${{ steps.filter.outputs.tf_files }}"

          # Remove the brackets and split the string by commas
          FILES_ARRAY=($(echo "$FILES" | sed 's/[][]//g' | tr ',' '\n'))

          # Initialize a variable to store the new names
          NEW_FILE_NAMES=()

          # Loop through the files and replace the paths
          for FILE_PATH in "${FILES_ARRAY[@]}"; do
            echo "Processing file: $FILE_PATH"
            # Remove 'images/' and '.Dockerfile' from the filename
            NEW_NAME=$(basename "$FILE_PATH" .Dockerfile | sed 's/^images\///')
            # Append the new name to the array
            NEW_FILE_NAMES+=("\"$NEW_NAME\"")
          done

          # Join the array into a JSON array format
          JSON_OUTPUT=$(printf "[%s]" "$(IFS=,; echo "${NEW_FILE_NAMES[*]}")")

          # Debugging output
          echo "Final JSON Output: $JSON_OUTPUT"

          # Set the output for the replaced names in JSON format
          echo "::set-output name=tf_files_new::$JSON_OUTPUT"

      - name: Use replaced filenames
        run: |
          echo "Processed filenames: ${{ steps.replace_files_base.outputs.base_files_new}}"
          echo "Processed filenames: ${{ steps.replace_files_torch.outputs.torch_files_new}}"
          echo "Processed filenames: ${{ steps.replace_files_tf.outputs.tf_files_new}}"


  build-dockerfiles-base:
    needs: [get-changed-files]
    name: Base
    if: ${{ needs.get-changed-files.outputs.base }}
    uses: ./.github/workflows/build-latest.yml
    secrets: inherit
    with:
      runner: '["base", "dind", "2204"]'
      runner-archs: '["amd64", "arm64", "arm"]'
      dockerfiles: ${{ needs.get-changed-files.outputs.files_base }}

  build-dockerfiles-tf:
    needs: [get-changed-files]
    name: TF
    if: ${{ needs.get-changed-files.outputs.tf }}
    uses: ./.github/workflows/build-latest.yml
    secrets: inherit
    with:
      runner: '["base", "dind", "2204"]'
      runner-archs: '["amd64", "arm64"]'
      dockerfiles: ${{ needs.get-changed-files.outputs.files_tf }}

  build-dockerfiles-torch:
    needs: [get-changed-files]
    name: Torch 
    if: ${{ needs.get-changed-files.outputs.torch }}
    uses: ./.github/workflows/build-latest.yml
    secrets: inherit
    with:
      runner: '["base", "dind", "2204"]'
      runner-archs: '["amd64", "arm64"]'
      dockerfiles: ${{ needs.get-changed-files.outputs.files_torch }}

